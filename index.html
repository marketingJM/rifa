<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rifa Cadena de Oro 18K</title>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      getDocs,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================
    // CONFIGURACIÓN DE FIREBASE
    // =========================================================

    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseDB = db;
    window.firebaseFirestore = {
      collection,
      doc,
      getDocs,
      runTransaction,
      serverTimestamp
    };

    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    /* ================================
       ENCABEZADO
    ================================= */

    .titulo-rifa {
      text-align: center;
      margin-bottom: 35px;
    }

    .titulo-rifa .rifa {
      color: #d8af32;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 12px;
      margin-bottom: 5px;
    }

    .titulo-rifa .titulo {
      color: #fff;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 2px;
    }

    /* ================================
       INFORMACIÓN
    ================================= */

    .info-boxes {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 45px;
    }

    .info-box {
      width: 330px;
      max-width: 100%;
      border: 2px solid #c9a52e;
      border-radius: 18px;
      padding: 20px 15px;
      text-align: center;
      background: #0b0b0b;
    }

    .info-label {
      color: #bcbcbc;
      font-size: 19px;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .info-value {
      color: #d8af32;
      font-size: 27px;
      font-weight: bold;
    }

    /* ================================
       TEXTO
    ================================= */

    .selecciona {
      text-align: center;
      font-size: 22px;
      color: #eee;
      margin-bottom: 25px;
    }

    .leyenda {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .circulo {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-block;
    }

    .circulo.disponible {
      background: #d8af32;
    }

    .circulo.ocupado {
      background: #555;
    }

    /* ================================
       GRID DE NÚMEROS
    ================================= */

    .numeros {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      width: 100%;
    }

    .numero {
      height: 52px;
      border: 2px solid #c9a52e;
      border-radius: 11px;
      background: #050505;
      color: #d8af32;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .numero:hover {
      background: #d8af32;
      color: #000;
      transform: scale(1.04);
    }

    .numero.ocupado {
      background: #333;
      border-color: #444;
      color: #aaa;
      cursor: not-allowed;
    }

    .numero.ocupado:hover {
      transform: none;
      background: #333;
      color: #aaa;
    }

    /* ================================
       MODAL
    ================================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 9999;
      overflow-y: auto;
    }

    .overlay.activo {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 630px;
      background: #101010;
      border: 2px solid #d4ae36;
      border-radius: 32px;
      padding: 45px 40px 35px;
      position: relative;
      box-shadow: 0 0 30px rgba(216,175,50,.12);
    }

    .cerrar {
      position: absolute;
      right: 28px;
      top: 25px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 40px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-titulo {
      text-align: center;
      color: #d8af32;
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 25px;
      white-space: nowrap;
    }

    .numero-seleccionado {
      text-align: center;
      color: #fff;
      font-size: 88px;
      font-weight: 800;
      margin-bottom: 35px;
    }

    .campo {
      margin-bottom: 22px;
    }

    .campo label {
      display: block;
      color: #ddd;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .campo input,
    .campo select {
      width: 100%;
      height: 62px;
      background: #050505;
      border: 2px solid #555;
      border-radius: 14px;
      color: #fff;
      font-size: 19px;
      padding: 0 20px;
      outline: none;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: #d8af32;
    }

    /* ================================
       TELÉFONO
    ================================= */

    .telefono-container {
      display: flex;
      gap: 8px;
    }

    .codigo-pais {
      flex: 0 0 145px;
      padding: 0 8px !important;
    }

    .telefono-input {
      flex: 1;
    }

    /* ================================
       BOTÓN
    ================================= */

    .btn-confirmar {
      width: 100%;
      height: 68px;
      border: none;
      border-radius: 17px;
      background: #555;
      color: #aaa;
      font-size: 27px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .btn-confirmar.activo {
      background: #d8af32;
      color: #000;
    }

    .btn-confirmar.activo:hover {
      background: #e7c34b;
    }

    .btn-confirmar:disabled {
      cursor: not-allowed;
    }

    .mensaje {
      text-align: center;
      color: #d8af32;
      font-size: 18px;
      margin-top: 20px;
      min-height: 25px;
    }

    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 600px) {

      .container {
        padding: 25px 20px 45px;
      }

      .titulo-rifa .rifa {
        font-size: 38px;
        letter-spacing: 8px;
      }

      .titulo-rifa .titulo {
        font-size: 32px;
      }

      .info-box {
        width: 320px;
      }

      .selecciona {
        font-size: 19px;
      }

      .numeros {
        gap: 8px;
      }

      .numero {
        height: 48px;
        font-size: 17px;
        border-radius: 10px;
      }

      .modal {
        padding: 40px 24px 28px;
        border-radius: 28px;
      }

      .modal-titulo {
        font-size: 32px;
      }

      .numero-seleccionado {
        font-size: 72px;
        margin-bottom: 25px;
      }

      .campo label {
        font-size: 18px;
      }

      .campo input,
      .campo select {
        height: 58px;
        font-size: 17px;
      }

      .codigo-pais {
        flex-basis: 125px;
      }

      .btn-confirmar {
        height: 62px;
        font-size: 23px;
      }
    }

    @media (max-width: 380px) {

      .numeros {
        gap: 6px;
      }

      .numero {
        height: 43px;
        font-size: 15px;
      }

      .codigo-pais {
        flex-basis: 110px;
        font-size: 14px !important;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- ENCABEZADO -->

    <div class="titulo-rifa">

      <div class="rifa">
        RIFA
      </div>

      <div class="titulo">
        CADENA DE<br>
        ORO 18K
      </div>

    </div>


    <!-- INFORMACIÓN -->

    <div class="info-boxes">

      <div class="info-box">

        <div class="info-label">
          FECHA DEL SORTEO
        </div>

        <div class="info-value">
          19 DE JUNIO
        </div>

      </div>


      <div class="info-box">

        <div class="info-label">
          VALOR POR NÚMERO
        </div>

        <div class="info-value">
          $70.000
        </div>

      </div>

    </div>


    <div class="selecciona">
      Selecciona el número que deseas reservar
    </div>


    <div class="leyenda">

      <div class="leyenda-item">
        <span class="circulo disponible"></span>
        Disponible
      </div>

      <div class="leyenda-item">
        <span class="circulo ocupado"></span>
        Ocupado
      </div>

    </div>


    <!-- NÚMEROS -->

    <div id="numeros" class="numeros"></div>

  </div>


  <!-- =========================================
       MODAL
  ========================================== -->

  <div id="overlay" class="overlay">

    <div class="modal">

      <button
        class="cerrar"
        id="btnCerrar"
        type="button">
        ×
      </button>


      <div class="modal-titulo">
        RESERVAR NÚMERO
      </div>


      <div
        id="numeroSeleccionado"
        class="numero-seleccionado">
        00
      </div>


      <!-- NOMBRE -->

      <div class="campo">

        <label for="nombre">
          Nombre completo
        </label>

        <input
          id="nombre"
          type="text"
          placeholder="Escribe tu nombre"
          autocomplete="name">

      </div>


      <!-- TELÉFONO -->

      <div class="campo">

        <label for="telefono">
          Número de WhatsApp
        </label>

        <div class="telefono-container">

          <select
            id="codigoPais"
            class="codigo-pais">

            <option value="+57" selected>
              🇨🇴 +57
            </option>

            <option value="+58">
              🇻🇪 +58
            </option>

            <option value="+593">
              🇪🇨 +593
            </option>

            <option value="+507">
              🇵🇦 +507
            </option>

            <option value="+51">
              🇵🇪 +51
            </option>

            <option value="+52">
              🇲🇽 +52
            </option>

            <option value="+54">
              🇦🇷 +54
            </option>

            <option value="+55">
              🇧🇷 +55
            </option>

            <option value="+56">
              🇨🇱 +56
            </option>

            <option value="+34">
              🇪🇸 +34
            </option>

            <option value="+1">
              🇺🇸 +1
            </option>

            <option value="+1">
              🇨🇦 +1
            </option>

            <option value="+44">
              🇬🇧 +44
            </option>

            <option value="+33">
              🇫🇷 +33
            </option>

            <option value="+49">
              🇩🇪 +49
            </option>

            <option value="+39">
              🇮🇹 +39
            </option>

          </select>


          <input
            id="telefono"
            class="telefono-input"
            type="tel"
            inputmode="numeric"
            placeholder="300 123 4567"
            autocomplete="tel">

        </div>

      </div>


      <!-- ESTADO DEL PAGO -->

      <div class="campo">

        <label for="estadoPago">
          Estado del pago
        </label>

        <select id="estadoPago">

          <option value="">
            Selecciona una opción
          </option>

          <option value="Pagó">
            Pagó
          </option>

          <option value="Abono">
            Abono
          </option>

          <option value="Solo separo">
            Solo separo
          </option>

        </select>

      </div>


      <!-- CONFIRMAR -->

      <button
        id="btnConfirmar"
        class="btn-confirmar"
        type="button"
        disabled>

        CONFIRMAR

      </button>


      <div
        id="mensaje"
        class="mensaje">
      </div>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    let db = null;

    let numeroActual = null;

    let procesando = false;


    // =========================================================
    // ESPERAR FIREBASE
    // =========================================================

    window.addEventListener("firebaseReady", () => {

      db = window.firebaseDB;

      cargarNumeros();

    });


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const numerosContainer =
      document.getElementById("numeros");

    const overlay =
      document.getElementById("overlay");

    const numeroSeleccionado =
      document.getElementById("numeroSeleccionado");

    const nombre =
      document.getElementById("nombre");

    const codigoPais =
      document.getElementById("codigoPais");

    const telefono =
      document.getElementById("telefono");

    const estadoPago =
      document.getElementById("estadoPago");

    const btnConfirmar =
      document.getElementById("btnConfirmar");

    const btnCerrar =
      document.getElementById("btnCerrar");

    const mensaje =
      document.getElementById("mensaje");


    // =========================================================
    // CREAR NÚMEROS 00 - 99
    // =========================================================

    function crearNumeros() {

      numerosContainer.innerHTML = "";

      for (let i = 0; i <= 99; i++) {

        const numero =
          String(i).padStart(2, "0");

        const boton =
          document.createElement("button");

        boton.type = "button";

        boton.className = "numero";

        boton.textContent = numero;

        boton.dataset.numero = numero;

        boton.addEventListener(
          "click",
          () => abrirModal(numero)
        );

        numerosContainer.appendChild(boton);
      }
    }


    // =========================================================
    // CARGAR RESERVAS DESDE FIREBASE
    // =========================================================

    async function cargarNumeros() {

      crearNumeros();

      if (!db) return;

      try {

        const {
          collection,
          getDocs
        } = window.firebaseFirestore;

        const snapshot =
          await getDocs(
            collection(db, "reservas")
          );

        snapshot.forEach(docSnap => {

          const data =
            docSnap.data();

          if (!data.numero) return;

          marcarOcupado(
            String(data.numero).padStart(2, "0")
          );

        });

      } catch (error) {

        console.error(
          "Error cargando reservas:",
          error
        );

      }
    }


    // =========================================================
    // MARCAR NÚMERO COMO OCUPADO
    // =========================================================

    function marcarOcupado(numero) {

      const boton =
        document.querySelector(
          `.numero[data-numero="${numero}"]`
        );

      if (!boton) return;

      boton.classList.add("ocupado");

      boton.disabled = true;

    }


    // =========================================================
    // ABRIR MODAL
    // =========================================================

    function abrirModal(numero) {

      const boton =
        document.querySelector(
          `.numero[data-numero="${numero}"]`
        );

      if (
        !boton ||
        boton.classList.contains("ocupado")
      ) {
        return;
      }

      numeroActual = numero;

      numeroSeleccionado.textContent =
        numero;

      nombre.value = "";

      telefono.value = "";

      codigoPais.value = "+57";

      estadoPago.value = "";

      mensaje.textContent = "";

      actualizarBoton();

      overlay.classList.add("activo");

      setTimeout(() => {
        nombre.focus();
      }, 100);

    }


    // =========================================================
    // CERRAR MODAL
    // =========================================================

    function cerrarModal() {

      if (procesando) return;

      overlay.classList.remove("activo");

      numeroActual = null;

    }

    btnCerrar.addEventListener(
      "click",
      cerrarModal
    );


    overlay.addEventListener(
      "click",
      function(event) {

        if (event.target === overlay) {
          cerrarModal();
        }

      }
    );


    // =========================================================
    // SOLO NÚMEROS EN TELÉFONO
    // =========================================================

    telefono.addEventListener(
      "input",
      function() {

        this.value =
          this.value.replace(/\D/g, "");

        actualizarBoton();

      }
    );


    nombre.addEventListener(
      "input",
      actualizarBoton
    );


    estadoPago.addEventListener(
      "change",
      actualizarBoton
    );


    // =========================================================
    // VALIDAR FORMULARIO
    // =========================================================

    function formularioValido() {

      const nombreValido =
        nombre.value.trim().length >= 2;

      const telefonoValido =
        telefono.value.trim().length >= 7;

      const estadoValido =
        estadoPago.value !== "";

      return (
        nombreValido &&
        telefonoValido &&
        estadoValido &&
        numeroActual !== null
      );

    }


    // =========================================================
    // ACTUALIZAR BOTÓN
    // =========================================================

    function actualizarBoton() {

      if (formularioValido()) {

        btnConfirmar.disabled = false;

        btnConfirmar.classList.add(
          "activo"
        );

      } else {

        btnConfirmar.disabled = true;

        btnConfirmar.classList.remove(
          "activo"
        );

      }

    }


    // =========================================================
    // CONFIRMAR RESERVA
    // =========================================================

    btnConfirmar.addEventListener(
      "click",
      confirmarReserva
    );


    async function confirmarReserva() {

      if (
        procesando ||
        !formularioValido()
      ) {
        return;
      }

      if (!db) {

        mensaje.textContent =
          "Firebase todavía no está conectado.";

        return;

      }

      procesando = true;

      btnConfirmar.disabled = true;

      btnConfirmar.textContent =
        "GUARDANDO...";

      mensaje.textContent = "";


      const numero =
        numeroActual;

      const nombreCliente =
        nombre.value.trim();

      const codigo =
        codigoPais.value;

      const telefonoCliente =
        telefono.value.trim();

      const estado =
        estadoPago.value;

      const telefonoCompleto =
        codigo + telefonoCliente;


      try {

        const {
          doc,
          runTransaction,
          serverTimestamp
        } = window.firebaseFirestore;


        /*
         * Cada número tiene su propio documento:
         *
         * reservas/00
         * reservas/01
         * reservas/02
         * ...
         * reservas/99
         *
         * Esto permite bloquear el número
         * incluso si dos personas intentan
         * reservarlo casi al mismo tiempo.
         */

        const referencia =
          doc(
            db,
            "reservas",
            numero
          );


        await runTransaction(
          db,
          async transaction => {

            const existente =
              await transaction.get(
                referencia
              );

            if (existente.exists()) {

              throw new Error(
                "NUMERO_OCUPADO"
              );

            }


            transaction.set(
              referencia,
              {

                numero: numero,

                nombre:
                  nombreCliente,

                codigoPais:
                  codigo,

                telefono:
                  telefonoCliente,

                telefonoCompleto:
                  telefonoCompleto,

                estado:
                  estado,

                fecha:
                  serverTimestamp()

              }
            );

          }
        );


        // Marcar visualmente
        marcarOcupado(numero);


        // Mensaje
        mensaje.textContent =
          "Reserva registrada. Abriendo WhatsApp...";


        /*
         * =====================================================
         * WHATSAPP
         * =====================================================
         *
         * CAMBIA ESTE NÚMERO por el WhatsApp que recibirá
         * las reservas.
         *
         * IMPORTANTE:
         * Escribirlo con código de país y SIN +, espacios
         * ni guiones.
         *
         * Ejemplo Colombia:
         * 573001234567
         */

        const ADMIN_WHATSAPP =
          "573001234567";


        const textoWhatsApp =
          `Hola, quiero confirmar mi reserva.%0A%0A` +
          `🎟️ Número: ${numero}%0A` +
          `👤 Nombre: ${encodeURIComponent(nombreCliente)}%0A` +
          `📱 WhatsApp: ${encodeURIComponent(telefonoCompleto)}%0A` +
          `💰 Estado del pago: ${encodeURIComponent(estado)}%0A%0A` +
          `Rifa Cadena de Oro 18K`;


        const urlWhatsApp =
          `https://wa.me/${ADMIN_WHATSAPP}?text=${textoWhatsApp}`;


        setTimeout(() => {

          window.open(
            urlWhatsApp,
            "_blank"
          );

        }, 800);


        // Limpiar
        numeroActual = null;


        setTimeout(() => {

          overlay.classList.remove(
            "activo"
          );

          btnConfirmar.textContent =
            "CONFIRMAR";

          procesando = false;

        }, 1200);


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        if (
          error.message ===
          "NUMERO_OCUPADO"
        ) {

          mensaje.textContent =
            "⚠️ Este número acaba de ser reservado por otra persona.";

          marcarOcupado(numero);

        } else {

          mensaje.textContent =
            "No se pudo registrar la reserva. Intenta nuevamente.";

        }


        btnConfirmar.disabled = false;

        btnConfirmar.textContent =
          "CONFIRMAR";

        procesando = false;

      }

    }

  </script>

</body>
</html>

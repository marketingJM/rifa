<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RIFA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="rifa-container">

        <div class="rifa-card">

            <div class="etiqueta">
                RIFA
            </div>

            <h1 id="nombreArticulo">
                CADENA DE ORO 18K
            </h1>

            <div class="linea-dorada"></div>

            <div class="informacion">

                <div class="dato">
                    <span class="titulo-dato">FECHA</span>
                    <span class="valor-dato">19 DE JUNIO</span>
                </div>

                <div class="dato">
                    <span class="titulo-dato">VALOR</span>
                    <span class="valor-dato">$70.000</span>
                </div>

            </div>

            <button class="boton-participar" onclick="participar()">
                ELEGIR MI NÚMERO
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>

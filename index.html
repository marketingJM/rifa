<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RIFA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000000;
            color: #D4AF37;
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 35px 18px 50px;
            text-align: center;
        }

        /* TÍTULO */

        h1 {
            margin: 0;
            font-size: 55px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #D4AF37;
        }

        /* ARTÍCULO */

        .articulo {
            margin-top: 12px;
            font-size: 55px;
            font-weight: 900;
            line-height: 1.1;
            color: #D4AF37;
            text-transform: uppercase;
        }

        /* DATOS */

        .datos {
            margin-top: 25px;
            margin-bottom: 35px;
            font-size: 21px;
            font-weight: bold;
        }

        .fecha,
        .valor {
            margin: 10px 0;
        }

        /* CONTENEDOR DE NÚMEROS */

        .numeros {
            width: 100%;
            max-width: 850px;
            margin: auto;

            display: grid;

            grid-template-columns: repeat(10, 1fr);

            gap: 9px;
        }

        /* NÚMERO */

        .numero {
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #080808;

            border: 1px solid #D4AF37;

            border-radius: 8px;

            color: #D4AF37;

            font-size: 20px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                color 0.15s ease;
        }

        .numero:hover {
            background: #D4AF37;
            color: #000000;
            transform: scale(1.04);
        }

        /* NÚMERO RESERVADO */

        .numero.reservado {
            background: #272727;
            border-color: #555555;
            color: #777777;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .numero.reservado:hover {
            background: #272727;
            color: #777777;
            transform: none;
        }

        /* MODAL */

        .modal {
            display: none;

            position: fixed;

            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.88);

            padding: 20px;
        }

        .modal.activo {
            display: flex;

            align-items: center;
            justify-content: center;
        }

        .modal-contenido {

            width: 100%;
            max-width: 430px;

            background: #0b0b0b;

            border: 1px solid #D4AF37;

            border-radius: 18px;

            padding: 30px 25px;

            box-shadow:
                0 0 35px rgba(212, 175, 55, 0.25);

            position: relative;
        }

        .cerrar {

            position: absolute;

            top: 10px;
            right: 18px;

            font-size: 30px;

            color: #D4AF37;

            cursor: pointer;
        }

        .modal-titulo {

            font-size: 28px;

            font-weight: 900;

            margin-bottom: 8px;
        }

        .numero-seleccionado {

            font-size: 42px;

            font-weight: 900;

            margin-bottom: 25px;
        }

        /* FORMULARIO */

        label {

            display: block;

            text-align: left;

            margin-bottom: 7px;

            color: #D4AF37;

            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 8px;

            border: 1px solid #D4AF37;

            background: #000000;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus,
        select:focus {

            box-shadow:
                0 0 10px rgba(212, 175, 55, 0.25);
        }

        select option {

            background: #000000;

            color: white;
        }

        /* BOTÓN */

        .btn-confirmar {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #D4AF37;

            color: #000000;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-confirmar:hover {

            background: #f0d36a;

            transform: translateY(-1px);
        }

        .btn-confirmar:disabled {

            opacity: 0.6;

            cursor: wait;
        }

        /* MENSAJE */

        .mensaje {

            margin-top: 20px;

            font-size: 15px;

            color: #ffffff;
        }

        /* LEYENDA */

        .leyenda {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 25px;

            flex-wrap: wrap;

            font-size: 14px;

            color: #ffffff;
        }

        .leyenda-item {

            display: flex;

            align-items: center;

            gap: 7px;
        }

        .cuadro {

            width: 15px;
            height: 15px;

            border-radius: 4px;

            display: inline-block;
        }

        .disponible {

            background: #080808;

            border: 1px solid #D4AF37;
        }

        .ocupado {

            background: #272727;

            border: 1px solid #555555;
        }

        /* MÓVIL */

        @media (max-width: 600px) {

            .contenedor {
                padding: 25px 10px 40px;
            }

            h1,
            .articulo {
                font-size: 35px;
            }

            h1 {
                letter-spacing: 5px;
            }

            .datos {
                font-size: 17px;
            }

            .numeros {
                gap: 5px;
            }

            .numero {
                min-height: 43px;

                font-size: 15px;

                border-radius: 6px;
            }

            .modal-contenido {
                padding: 25px 18px;
            }
        }

    </style>

</head>


<body>


    <div class="contenedor">


        <!-- TÍTULO -->

        <h1>RIFA</h1>


        <!-- NOMBRE DEL ARTÍCULO -->

        <!-- CAMBIA ESTE TEXTO POR EL PREMIO -->

        <div class="articulo">
            ARTÍCULO
        </div>


        <!-- FECHA Y VALOR -->

        <div class="datos">

            <!-- CAMBIA LA FECHA -->

            <div class="fecha">
                📅 FECHA: 00/00/0000
            </div>


            <!-- CAMBIA EL VALOR -->

            <div class="valor">
                💰 VALOR: $00.000
            </div>

        </div>


        <!-- NÚMEROS -->

        <div
            class="numeros"
            id="numeros">
        </div>


        <!-- LEYENDA -->

        <div class="leyenda">

            <div class="leyenda-item">

                <span class="cuadro disponible"></span>

                Disponible

            </div>


            <div class="leyenda-item">

                <span class="cuadro ocupado"></span>

                Reservado

            </div>

        </div>


    </div>



    <!-- MODAL -->

    <div
        class="modal"
        id="modal">

        <div class="modal-contenido">


            <div
                class="cerrar"
                id="cerrar">
                ×
            </div>


            <div class="modal-titulo">

                Número seleccionado

            </div>


            <div
                class="numero-seleccionado"
                id="numeroSeleccionado">

                00

            </div>


            <!-- NOMBRE -->

            <label for="nombre">

                Nombre completo

            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
                autocomplete="name"
            >


            <!-- TIPO DE PAGO -->

            <label for="tipoPago">

                Estado del pago

            </label>

            <select id="tipoPago">

                <option value="Pago">
                    Pago
                </option>

                <option value="Abono">
                    Abono
                </option>

                <option value="Solo separar">
                    Solo separar
                </option>

            </select>


            <!-- BOTÓN -->

            <button
                class="btn-confirmar"
                id="confirmar">

                CONFIRMAR Y CONTINUAR

            </button>


            <div
                class="mensaje"
                id="mensaje">
            </div>


        </div>

    </div>



    <!-- FIREBASE -->

    <script type="module">


        /*
        =====================================================
        CONFIGURACIÓN DE FIREBASE
        =====================================================
        */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            runTransaction
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


        /*
        CONFIGURACIÓN DE TU PROYECTO
        */

        const firebaseConfig = {

            apiKey: "AIzaSyBlQ6Q9eJoJDaksUbq00DAMWxCIYVJSc",

            authDomain: "yo-rifo-e6643.firebaseapp.com",

            projectId: "yo-rifo-e6643",

            storageBucket: "yo-rifo-e6643.firebasestorage.app",

            messagingSenderId: "106958662416",

            appId: "1:106958662416:web:99ea2d0a194f55d3bf1c55",

            measurementId: "G-92N04K32V4"

        };


        /*
        INICIAR FIREBASE
        */

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);



        /*
        =====================================================
        ELEMENTOS DE LA PÁGINA
        =====================================================
        */

        const contenedorNumeros =
            document.getElementById("numeros");


        const modal =
            document.getElementById("modal");


        const cerrar =
            document.getElementById("cerrar");


        const numeroSeleccionado =
            document.getElementById("numeroSeleccionado");


        const nombre =
            document.getElementById("nombre");


        const tipoPago =
            document.getElementById("tipoPago");


        const confirmar =
            document.getElementById("confirmar");


        const mensaje =
            document.getElementById("mensaje");



        /*
        NÚMERO ACTUAL SELECCIONADO
        */

        let numeroActual = null;



        /*
        =====================================================
        CREAR LOS 100 NÚMEROS
        =====================================================
        */

        for (
            let i = 0;
            i <= 99;
            i++
        ) {

            const numero =
                i.toString().padStart(2, "0");


            const boton =
                document.createElement("div");


            boton.className = "numero";


            boton.textContent = numero;


            boton.dataset.numero = numero;


            boton.addEventListener(
                "click",
                () => seleccionarNumero(numero, boton)
            );


            contenedorNumeros.appendChild(boton);

        }



        /*
        =====================================================
        COMPROBAR ESTADOS EN FIREBASE
        =====================================================
        */

        async function cargarEstados() {

            for (
                let i = 0;
                i <= 99;
                i++
            ) {

                const numero =
                    i.toString().padStart(2, "0");


                const referencia =
                    doc(db, "numeros", numero);


                try {

                    const resultado =
                        await getDoc(referencia);


                    if (
                        resultado.exists()
                    ) {

                        const datos =
                            resultado.data();


                        if (
                            datos.Estado &&
                            datos.Estado !== "disponible"
                        ) {

                            marcarReservado(numero);

                        }

                    }

                } catch (error) {

                    console.error(
                        "Error leyendo número:",
                        numero,
                        error
                    );

                }

            }

        }



        /*
        MARCAR NÚMERO COMO RESERVADO
        */

        function marcarReservado(numero) {

            const boton =
                document.querySelector(
                    `[data-numero="${numero}"]`
                );


            if (boton) {

                boton.classList.add("reservado");

                boton.title =
                    "Número no disponible";

            }

        }



        /*
        =====================================================
        SELECCIONAR NÚMERO
        =====================================================
        */

        async function seleccionarNumero(
            numero,
            boton
        ) {


            /*
            Si ya está visualmente reservado,
            no permitimos seleccionarlo.
            */

            if (
                boton.classList.contains("reservado")
            ) {

                return;

            }


            /*
            Comprobar directamente en Firebase
            */

            try {

                const referencia =
                    doc(db, "numeros", numero);


                const resultado =
                    await getDoc(referencia);


                if (resultado.exists()) {

                    const datos =
                        resultado.data();


                    if (
                        datos.Estado &&
                        datos.Estado !== "disponible"
                    ) {

                        marcarReservado(numero);


                        alert(
                            "Este número ya fue reservado."
                        );


                        return;

                    }

                }


                numeroActual = numero;


                numeroSeleccionado.textContent =
                    numero;


                nombre.value = "";


                tipoPago.value =
                    "Pago";


                mensaje.textContent =
                    "";


                confirmar.disabled =
                    false;


                modal.classList.add(
                    "activo"
                );


                setTimeout(
                    () => nombre.focus(),
                    100
                );


            } catch (error) {

                console.error(error);


                alert(
                    "No fue posible comprobar el número. Intenta nuevamente."
                );

            }

        }



        /*
        =====================================================
        CERRAR MODAL
        =====================================================
        */

        cerrar.addEventListener(
            "click",
            cerrarModal
        );


        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === modal
                ) {

                    cerrarModal();

                }

            }
        );


        function cerrarModal() {

            modal.classList.remove(
                "activo"
            );

            numeroActual = null;

        }



        /*
        =====================================================
        CONFIRMAR RESERVA
        =====================================================
        */

        confirmar.addEventListener(
            "click",
            async function() {


                if (!numeroActual) {

                    return;

                }


                const nombreCliente =
                    nombre.value.trim();


                const pago =
                    tipoPago.value;


                /*
                VALIDAR NOMBRE
                */

                if (!nombreCliente) {

                    alert(
                        "Por favor escribe tu nombre."
                    );


                    nombre.focus();


                    return;

                }


                /*
                DESACTIVAR BOTÓN
                */

                confirmar.disabled =
                    true;


                mensaje.textContent =
                    "Procesando reserva...";


                const numero =
                    numeroActual;


                const referencia =
                    doc(
                        db,
                        "numeros",
                        numero
                    );


                try {


                    /*
                    =================================================
                    TRANSACCIÓN DE FIREBASE
                    =================================================

                    Esto comprueba nuevamente el estado
                    justo antes de guardar.

                    */

                    await runTransaction(
                        db,
                        async (transaction) => {


                            const resultado =
                                await transaction.get(
                                    referencia
                                );


                            if (
                                resultado.exists()
                            ) {

                                const datos =
                                    resultado.data();


                                if (
                                    datos.Estado &&
                                    datos.Estado !== "disponible"
                                ) {

                                    throw new Error(
                                        "NUMERO_OCUPADO"
                                    );

                                }

                            }


                            /*
                            GUARDAR RESERVA
                            */

                            transaction.set(
                                referencia,
                                {

                                    Numero: numero,

                                    Estado: "reservado",

                                    Nombre: nombreCliente,

                                    "Tipo de pago": pago,

                                    fechaReserva:
                                        new Date()
                                            .toISOString()

                                }
                            );

                        }
                    );


                    /*
                    =================================================
                    RESERVA EXITOSA
                    =================================================
                    */

                    marcarReservado(
                        numero
                    );


                    /*
                    MENSAJE PARA WHATSAPP
                    */

                    const textoWhatsApp =

                        "Hola, quiero reservar el número " +
                        numero +
                        " de la rifa.%0A%0A" +

                        "Nombre: " +
                        encodeURIComponent(
                            nombreCliente
                        ) +
                        "%0A" +

                        "Estado del pago: " +
                        encodeURIComponent(
                            pago
                        );


                    /*
                    NÚMERO DE WHATSAPP
                    */

                    const telefono =
                        "573226082281";


                    const urlWhatsApp =
                        "https://wa.me/" +
                        telefono +
                        "?text=" +
                        textoWhatsApp;


                    mensaje.textContent =
                        "Número reservado correctamente.";


                    /*
                    Abrir WhatsApp
                    */

                    setTimeout(
                        () => {

                            window.location.href =
                                urlWhatsApp;

                        },
                        500
                    );


                } catch (error) {


                    console.error(
                        error
                    );


                    if (
                        error.message ===
                        "NUMERO_OCUPADO"
                    ) {

                        marcarReservado(
                            numero
                        );


                        mensaje.textContent =
                            "Este número acaba de ser reservado por otra persona.";


                        alert(
                            "Lo sentimos, este número ya fue reservado."
                        );


                    } else {

                        mensaje.textContent =
                            "Ocurrió un error al guardar la reserva.";


                        alert(
                            "No se pudo guardar la reserva. Intenta nuevamente."
                        );

                    }


                    confirmar.disabled =
                        false;

                }

            }
        );



        /*
        =====================================================
        CARGAR ESTADOS AL ABRIR LA PÁGINA
        =====================================================
        */

        cargarEstados();


    </script>


</body>

</html>

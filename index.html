<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rifa Cadena de Oro 18K</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    /* =========================
       TITULO
    ========================= */

    .titulo-rifa {
      text-align: center;
      margin-bottom: 35px;
    }

    .rifa {
      color: #d8af32;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 12px;
      margin-bottom: 5px;
    }

    .titulo {
      color: #fff;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 2px;
    }

    /* =========================
       INFORMACION
    ========================= */

    .info-boxes {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 45px;
    }

    .info-box {
      width: 330px;
      max-width: 100%;
      border: 2px solid #c9a52e;
      border-radius: 18px;
      padding: 20px 15px;
      text-align: center;
      background: #0b0b0b;
    }

    .info-label {
      color: #bcbcbc;
      font-size: 19px;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .info-value {
      color: #d8af32;
      font-size: 27px;
      font-weight: bold;
    }

    /* =========================
       LEYENDA
    ========================= */

    .selecciona {
      text-align: center;
      font-size: 22px;
      color: #eee;
      margin-bottom: 25px;
    }

    .leyenda {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .circulo {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-block;
    }

    .disponible {
      background: #d8af32;
    }

    .ocupado {
      background: #555;
    }

    /* =========================
       NUMEROS
    ========================= */

    .numeros {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      width: 100%;
    }

    .numero {
      height: 52px;
      border: 2px solid #c9a52e;
      border-radius: 11px;
      background: #050505;
      color: #d8af32;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .numero:hover {
      background: #d8af32;
      color: #000;
      transform: scale(1.04);
    }

    .numero.ocupado {
      background: #333;
      border-color: #444;
      color: #aaa;
      cursor: not-allowed;
    }

    .numero.ocupado:hover {
      transform: none;
      background: #333;
      color: #aaa;
    }

    /* =========================
       MODAL
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .82);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 9999;
      overflow-y: auto;
    }

    .overlay.activo {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 630px;
      background: #101010;
      border: 2px solid #d4ae36;
      border-radius: 32px;
      padding: 45px 40px 35px;
      position: relative;
      box-shadow: 0 0 30px rgba(216, 175, 50, .12);
    }

    .cerrar {
      position: absolute;
      right: 28px;
      top: 25px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 40px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-titulo {
      text-align: center;
      color: #d8af32;
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 25px;
    }

    .numero-seleccionado {
      text-align: center;
      color: #fff;
      font-size: 88px;
      font-weight: 800;
      margin-bottom: 35px;
    }

    .campo {
      margin-bottom: 22px;
    }

    .campo label {
      display: block;
      color: #ddd;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .campo input,
    .campo select {
      width: 100%;
      height: 62px;
      background: #050505;
      border: 2px solid #555;
      border-radius: 14px;
      color: #fff;
      font-size: 19px;
      padding: 0 20px;
      outline: none;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: #d8af32;
    }

    /* =========================
       TELEFONO
    ========================= */

    .telefono-container {
      display: flex;
      gap: 8px;
    }

    .codigo-pais {
      flex: 0 0 140px;
      padding: 0 8px !important;
    }

    .telefono-input {
      flex: 1;
    }

    /* =========================
       BOTON
    ========================= */

    .btn-confirmar {
      width: 100%;
      height: 68px;
      border: none;
      border-radius: 17px;
      background: #555;
      color: #aaa;
      font-size: 27px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .btn-confirmar.activo {
      background: #d8af32;
      color: #000;
    }

    .btn-confirmar.activo:hover {
      background: #e7c34b;
    }

    .btn-confirmar:disabled {
      cursor: not-allowed;
    }

    .mensaje {
      text-align: center;
      color: #d8af32;
      font-size: 18px;
      margin-top: 20px;
      min-height: 25px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 25px 20px 45px;
      }

      .rifa {
        font-size: 38px;
        letter-spacing: 8px;
      }

      .titulo {
        font-size: 32px;
      }

      .selecciona {
        font-size: 19px;
      }

      .numeros {
        gap: 8px;
      }

      .numero {
        height: 48px;
        font-size: 17px;
      }

      .modal {
        padding: 40px 24px 28px;
        border-radius: 28px;
      }

      .modal-titulo {
        font-size: 32px;
      }

      .numero-seleccionado {
        font-size: 72px;
      }

      .campo label {
        font-size: 18px;
      }

      .campo input,
      .campo select {
        height: 58px;
        font-size: 17px;
      }

      .codigo-pais {
        flex-basis: 120px;
      }

      .btn-confirmar {
        height: 62px;
        font-size: 23px;
      }
    }

    @media (max-width: 380px) {

      .numeros {
        gap: 6px;
      }

      .numero {
        height: 43px;
        font-size: 15px;
      }

      .codigo-pais {
        flex-basis: 105px;
        font-size: 14px !important;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TITULO -->

    <div class="titulo-rifa">

      <div class="rifa">
        RIFA
      </div>

      <div class="titulo">
        CADENA DE<br>
        ORO 18K
      </div>

    </div>


    <!-- INFORMACION -->

    <div class="info-boxes">

      <div class="info-box">

        <div class="info-label">
          FECHA DEL SORTEO
        </div>

        <div class="info-value">
          19 DE JUNIO
        </div>

      </div>


      <div class="info-box">

        <div class="info-label">
          VALOR POR NÚMERO
        </div>

        <div class="info-value">
          $70.000
        </div>

      </div>

    </div>


    <div class="selecciona">
      Selecciona el número que deseas reservar
    </div>


    <div class="leyenda">

      <div class="leyenda-item">
        <span class="circulo disponible"></span>
        Disponible
      </div>

      <div class="leyenda-item">
        <span class="circulo ocupado"></span>
        Ocupado
      </div>

    </div>


    <!-- NUMEROS -->

    <div id="numeros" class="numeros"></div>

  </div>


  <!-- =================================
       MODAL
  ================================== -->

  <div id="overlay" class="overlay">

    <div class="modal">

      <button
        id="btnCerrar"
        class="cerrar"
        type="button">
        ×
      </button>


      <div class="modal-titulo">
        RESERVAR NÚMERO
      </div>


      <div
        id="numeroSeleccionado"
        class="numero-seleccionado">
        00
      </div>


      <!-- NOMBRE -->

      <div class="campo">

        <label for="nombre">
          Nombre completo
        </label>

        <input
          id="nombre"
          type="text"
          placeholder="Escribe tu nombre"
          autocomplete="name">

      </div>


      <!-- TELEFONO -->

      <div class="campo">

        <label for="telefono">
          Número de WhatsApp
        </label>

        <div class="telefono-container">

          <select
            id="codigoPais"
            class="codigo-pais">

            <option value="+57">
              🇨🇴 +57
            </option>

            <option value="+58">
              🇻🇪 +58
            </option>

            <option value="+593">
              🇪🇨 +593
            </option>

            <option value="+507">
              🇵🇦 +507
            </option>

            <option value="+51">
              🇵🇪 +51
            </option>

            <option value="+52">
              🇲🇽 +52
            </option>

            <option value="+54">
              🇦🇷 +54
            </option>

            <option value="+55">
              🇧🇷 +55
            </option>

            <option value="+56">
              🇨🇱 +56
            </option>

            <option value="+34">
              🇪🇸 +34
            </option>

            <option value="+1">
              🇺🇸 +1
            </option>

            <option value="+44">
              🇬🇧 +44
            </option>

            <option value="+33">
              🇫🇷 +33
            </option>

            <option value="+49">
              🇩🇪 +49
            </option>

            <option value="+39">
              🇮🇹 +39
            </option>

          </select>


          <input
            id="telefono"
            class="telefono-input"
            type="tel"
            inputmode="numeric"
            placeholder="300 123 4567"
            autocomplete="tel">

        </div>

      </div>


      <!-- ESTADO DEL PAGO -->

      <div class="campo">

        <label for="tipoPago">
          Estado del pago
        </label>

        <select id="tipoPago">

          <option value="">
            Selecciona una opción
          </option>

          <option value="Pagó">
            Pagó
          </option>

          <option value="Abono">
            Abono
          </option>

          <option value="Solo separo">
            Solo separo
          </option>

        </select>

      </div>


      <button
        id="btnConfirmar"
        class="btn-confirmar"
        type="button"
        disabled>

        CONFIRMAR

      </button>


      <div
        id="mensaje"
        class="mensaje">
      </div>

    </div>

  </div>


  <!-- =========================================
       FIREBASE + JAVASCRIPT
  ========================================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================================
       TU FIREBASE
    ========================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBIq6Q9eJoJDaksUbgOODAMWXcHIYVJYSc",

      authDomain:
        "yo-rifo-e6643.firebaseapp.com",

      projectId:
        "yo-rifo-e6643",

      storageBucket:
        "yo-rifo-e6643.firebasestorage.app",

      messagingSenderId:
        "1069586862416",

      appId:
        "1:1069586862416:web:99ea2d0a194f55d3bf1c55",

      measurementId:
        "G-91M04K32V4"
    };


    /* =========================================
       INICIALIZAR FIREBASE
    ========================================== */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    /* =========================================
       WHATSAPP DEL ADMINISTRADOR

       ⚠️ CAMBIA ESTE NÚMERO

       Debe ir:
       código de país + número

       SIN +
       SIN espacios
       SIN guiones

       Ejemplo Colombia:
       573001234567
    ========================================== */

    const WHATSAPP_ADMIN =
      "573001234567";


    /* =========================================
       ELEMENTOS
    ========================================== */

    const numerosContainer =
      document.getElementById("numeros");

    const overlay =
      document.getElementById("overlay");

    const numeroSeleccionado =
      document.getElementById("numeroSeleccionado");

    const nombre =
      document.getElementById("nombre");

    const codigoPais =
      document.getElementById("codigoPais");

    const telefono =
      document.getElementById("telefono");

    const tipoPago =
      document.getElementById("tipoPago");

    const btnConfirmar =
      document.getElementById("btnConfirmar");

    const btnCerrar =
      document.getElementById("btnCerrar");

    const mensaje =
      document.getElementById("mensaje");


    let numeroActual = null;

    let procesando = false;


    /* =========================================
       CREAR LOS 100 NUMEROS
    ========================================== */

    function crearNumeros() {

      numerosContainer.innerHTML = "";

      for (let i = 0; i <= 99; i++) {

        const numero =
          String(i).padStart(2, "0");

        const boton =
          document.createElement("button");

        boton.type = "button";

        boton.className = "numero";

        boton.textContent = numero;

        boton.dataset.numero = numero;

        boton.addEventListener(
          "click",
          () => abrirModal(numero)
        );

        numerosContainer.appendChild(boton);
      }
    }


    /* =========================================
       CARGAR NUMEROS OCUPADOS
    ========================================== */

    async function cargarReservas() {

      crearNumeros();

      try {

        const referencia =
          collection(db, "numeros");

        const snapshot =
          await getDocs(referencia);

        snapshot.forEach((documento) => {

          const datos =
            documento.data();

          /*
           * Usamos el ID del documento.
           *
           * Ejemplo:
           * numeros / 15
           */

          const numero =
            documento.id.padStart(2, "0");

          /*
           * Solo marcamos ocupado si
           * el documento realmente tiene
           * información de una reserva.
           */

          if (
            datos &&
            (
              datos.nombre ||
              datos.tipoPago ||
              datos.estado
            )
          ) {

            marcarOcupado(numero);

          }

        });

      } catch (error) {

        console.error(
          "Error cargando números:",
          error
        );

        mensajeErrorInicial();

      }
    }


    /* =========================================
       MARCAR OCUPADO
    ========================================== */

    function marcarOcupado(numero) {

      const boton =
        document.querySelector(
          `.numero[data-numero="${numero}"]`
        );

      if (!boton) return;

      boton.classList.add("ocupado");

      boton.disabled = true;
    }


    /* =========================================
       MENSAJE DE ERROR INICIAL
    ========================================== */

    function mensajeErrorInicial() {

      console.error(
        "No se pudieron cargar las reservas."
      );

    }


    /* =========================================
       ABRIR MODAL
    ========================================== */

    function abrirModal(numero) {

      const boton =
        document.querySelector(
          `.numero[data-numero="${numero}"]`
        );

      if (!boton) return;

      if (
        boton.classList.contains("ocupado")
      ) {
        return;
      }

      numeroActual = numero;

      numeroSeleccionado.textContent =
        numero;

      nombre.value = "";

      telefono.value = "";

      codigoPais.value = "+57";

      tipoPago.value = "";

      mensaje.textContent = "";

      btnConfirmar.disabled = true;

      btnConfirmar.classList.remove(
        "activo"
      );

      btnConfirmar.textContent =
        "CONFIRMAR";

      overlay.classList.add("activo");

      setTimeout(() => {

        nombre.focus();

      }, 150);

    }


    /* =========================================
       CERRAR MODAL
    ========================================== */

    function cerrarModal() {

      if (procesando) return;

      overlay.classList.remove(
        "activo"
      );

      numeroActual = null;
    }


    btnCerrar.addEventListener(
      "click",
      cerrarModal
    );


    overlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target === overlay
        ) {

          cerrarModal();

        }

      }
    );


    /* =========================================
       VALIDAR TELEFONO
    ========================================== */

    telefono.addEventListener(
      "input",
      () => {

        telefono.value =
          telefono.value.replace(
            /\D/g,
            ""
          );

        validarFormulario();

      }
    );


    nombre.addEventListener(
      "input",
      validarFormulario
    );


    tipoPago.addEventListener(
      "change",
      validarFormulario
    );


    /* =========================================
       VALIDAR FORMULARIO
    ========================================== */

    function validarFormulario() {

      const nombreValido =
        nombre.value.trim().length >= 2;

      const telefonoValido =
        telefono.value.trim().length >= 7;

      const pagoValido =
        tipoPago.value !== "";

      const valido =
        nombreValido &&
        telefonoValido &&
        pagoValido &&
        numeroActual !== null;


      if (valido) {

        btnConfirmar.disabled =
          false;

        btnConfirmar.classList.add(
          "activo"
        );

      } else {

        btnConfirmar.disabled =
          true;

        btnConfirmar.classList.remove(
          "activo"
        );

      }

    }


    /* =========================================
       CONFIRMAR RESERVA
    ========================================== */

    btnConfirmar.addEventListener(
      "click",
      confirmarReserva
    );


    async function confirmarReserva() {

      if (
        procesando ||
        btnConfirmar.disabled ||
        !numeroActual
      ) {

        return;

      }


      procesando = true;

      btnConfirmar.disabled = true;

      btnConfirmar.textContent =
        "GUARDANDO...";

      mensaje.textContent = "";


      const numero =
        numeroActual;

      const nombreCliente =
        nombre.value.trim();

      const codigo =
        codigoPais.value;

      const telefonoCliente =
        telefono.value.trim();

      const pago =
        tipoPago.value;

      const telefonoCompleto =
        codigo + telefonoCliente;


      try {

        /*
         * IMPORTANTE:
         *
         * El documento será:
         *
         * numeros / 15
         *
         * numeros / 16
         *
         * etc.
         */

        const referencia =
          doc(
            db,
            "numeros",
            numero
          );


        /*
         * TRANSACCION
         *
         * Si dos personas intentan
         * reservar el mismo número,
         * Firebase solo permitirá una.
         */

        await runTransaction(
          db,
          async (transaction) => {

            const documento =
              await transaction.get(
                referencia
              );


            if (
              documento.exists()
            ) {

              throw new Error(
                "NUMERO_OCUPADO"
              );

            }


            transaction.set(
              referencia,
              {

                numero:
                  numero,

                nombre:
                  nombreCliente,

                "Codigo de país":
                  codigo,

                "Telefono":
                  telefonoCliente,

                "Telefono completo":
                  telefonoCompleto,

                tipoPago:
                  pago,

                /*
                 * Dejamos también estado
                 * para mantener compatibilidad
                 * con tu estructura actual.
                 */

                estado:
                  pago,

                fecha:
                  serverTimestamp()

              }
            );

          }
        );


        /* =================================
           RESERVA EXITOSA
        ================================== */

        marcarOcupado(numero);


        mensaje.textContent =
          "Reserva registrada. Abriendo WhatsApp...";


        /*
         * MENSAJE DE WHATSAPP
         */

        const texto =
          "Hola, quiero confirmar mi reserva.\n\n" +

          "🎟️ Número: " +
          numero +
          "\n" +

          "👤 Nombre: " +
          nombreCliente +
          "\n" +

          "📱 WhatsApp: " +
          telefonoCompleto +
          "\n" +

          "💰 Estado del pago: " +
          pago +
          "\n\n" +

          "Rifa Cadena de Oro 18K";


        const urlWhatsApp =
          "https://wa.me/" +
          WHATSAPP_ADMIN +
          "?text=" +
          encodeURIComponent(texto);


        /*
         * Abrir WhatsApp
         */

        setTimeout(() => {

          window.location.href =
            urlWhatsApp;

        }, 700);


        /*
         * Limpiar
         */

        numeroActual = null;


        setTimeout(() => {

          overlay.classList.remove(
            "activo"
          );

          btnConfirmar.textContent =
            "CONFIRMAR";

          procesando = false;

        }, 1500);


      } catch (error) {

        console.error(
          "Error reservando:",
          error
        );


        /* =================================
           NUMERO YA RESERVADO
        ================================== */

        if (
          error.message ===
          "NUMERO_OCUPADO"
        ) {

          mensaje.textContent =
            "⚠️ Este número ya fue reservado por otra persona.";

          marcarOcupado(numero);


        } else {

          mensaje.textContent =
            "❌ No se pudo registrar la reserva. Revisa la conexión.";

        }


        btnConfirmar.disabled =
          false;

        btnConfirmar.classList.add(
          "activo"
        );

        btnConfirmar.textContent =
          "CONFIRMAR";

        procesando = false;

      }

    }


    /* =========================================
       INICIAR
    ========================================== */

    cargarReservas();

  </script>

</body>
</html>

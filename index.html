<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RIFA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        /* ENCABEZADO */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .titulo {
            font-size: clamp(42px, 8vw, 75px);
            font-weight: 900;
            letter-spacing: 8px;
            color: #d4af37;
            line-height: 1;
            text-transform: uppercase;
        }

        .articulo {
            font-size: clamp(42px, 8vw, 75px);
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
            margin-top: 10px;
            line-height: 1;
            text-transform: uppercase;
        }

        .datos-rifa {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .dato {
            border: 1px solid #d4af37;
            padding: 14px 25px;
            border-radius: 10px;
            min-width: 180px;
            background: #0d0d0d;
        }

        .dato span {
            display: block;
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .dato strong {
            color: #d4af37;
            font-size: 22px;
        }

        /* INFORMACIÓN */

        .instruccion {
            text-align: center;
            margin: 35px 0 20px;
            color: #ddd;
            font-size: 17px;
        }

        .leyenda {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .punto {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            display: inline-block;
        }

        .libre {
            background: #d4af37;
        }

        .ocupado {
            background: #555;
        }

        /* CUADRÍCULA */

        .numeros {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            width: 100%;
        }

        .numero {
            aspect-ratio: 1 / 1;
            border: 1px solid #d4af37;
            background: linear-gradient(145deg, #161616, #080808);
            color: #d4af37;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(14px, 3vw, 23px);
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .numero:hover {
            background: #d4af37;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212,175,55,0.25);
        }

        .numero.ocupado-numero {
            background: #292929;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
        }

        .numero.ocupado-numero:hover {
            transform: none;
            box-shadow: none;
            background: #292929;
            color: #777;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            width: 100%;
            max-width: 450px;
            background: #101010;
            border: 1px solid #d4af37;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(212,175,55,0.15);
            position: relative;
        }

        .cerrar {
            position: absolute;
            top: 12px;
            right: 18px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 28px;
            cursor: pointer;
        }

        .modal-titulo {
            text-align: center;
            color: #d4af37;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .numero-seleccionado {
            text-align: center;
            font-size: 45px;
            font-weight: bold;
            color: white;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 14px;
            background: #050505;
            border: 1px solid #555;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #d4af37;
        }

        .boton-confirmar {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #d4af37;
            color: #000;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .boton-confirmar:hover {
            background: #f0d267;
            transform: translateY(-1px);
        }

        .boton-confirmar:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            color: #d4af37;
            font-size: 14px;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .container {
                padding: 25px 12px 50px;
            }

            .numeros {
                gap: 6px;
            }

            .numero {
                border-radius: 7px;
            }

            .datos-rifa {
                gap: 10px;
            }

            .dato {
                min-width: 140px;
                padding: 12px;
            }

            .dato strong {
                font-size: 18px;
            }

            .modal-contenido {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ENCABEZADO -->

    <header class="header">

        <div class="titulo">
            RIFA
        </div>

        <div class="articulo" id="nombreArticulo">
            CADENA DE ORO 18K
        </div>

        <div class="datos-rifa">

            <div class="dato">
                <span>Fecha del sorteo</span>
                <strong id="fechaRifa">
                    19 DE JUNIO
                </strong>
            </div>

            <div class="dato">
                <span>Valor por número</span>
                <strong id="valorRifa">
                    $70.000
                </strong>
            </div>

        </div>

    </header>


    <div class="instruccion">
        Selecciona el número que deseas reservar
    </div>


    <div class="leyenda">

        <div class="leyenda-item">
            <span class="punto libre"></span>
            Disponible
        </div>

        <div class="leyenda-item">
            <span class="punto ocupado"></span>
            Ocupado
        </div>

    </div>


    <!-- NÚMEROS -->

    <div class="numeros" id="numeros">
    </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-contenido">

        <button class="cerrar" id="cerrar">
            ×
        </button>

        <div class="modal-titulo">
            RESERVAR NÚMERO
        </div>

        <div class="numero-seleccionado" id="numeroSeleccionado">
            00
        </div>


        <div class="campo">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Escribe tu nombre"
                autocomplete="name"
            >

        </div>


        <div class="campo">

            <label for="tipoPago">
                Estado del pago
            </label>

            <select id="tipoPago">

                <option value="">
                    Selecciona una opción
                </option>

                <option value="Pagó">
                    Pagó
                </option>

                <option value="Abono">
                    Abono
                </option>

                <option value="Solo separo">
                    Solo separo
                </option>

            </select>

        </div>


        <button
            class="boton-confirmar"
            id="confirmar"
        >
            CONFIRMAR
        </button>

        <div
            class="mensaje"
            id="mensaje"
        ></div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        runTransaction
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =====================================================
       CONFIGURACIÓN FIREBASE
       ===================================================== */

    const firebaseConfig = {

        apiKey: "AIzaSyBIqQ6Q9eJoJDaksUbG00DAMWxCIHYVJSc",

        authDomain:
            "yo-rifo-e6643.firebaseapp.com",

        projectId:
            "yo-rifo-e6643",

        storageBucket:
            "yo-rifo-e6643.firebasestorage.app",

        messagingSenderId:
            "1069586862416",

        appId:
            "1:1069586862416:web:99ea2d0a194f55d3bf1c55",

        measurementId:
            "G-91M04K32V4"
    };


    /* INICIAR FIREBASE */

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    /* =====================================================
       CONFIGURACIÓN DE LA RIFA
       ===================================================== */

    const CONFIG = {

        coleccion:
            "numeros",

        telefonoWhatsApp:
            "573226082281"

    };


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const contenedorNumeros =
        document.getElementById("numeros");

    const modal =
        document.getElementById("modal");

    const cerrar =
        document.getElementById("cerrar");

    const numeroSeleccionado =
        document.getElementById("numeroSeleccionado");

    const nombre =
        document.getElementById("nombre");

    const tipoPago =
        document.getElementById("tipoPago");

    const confirmar =
        document.getElementById("confirmar");

    const mensaje =
        document.getElementById("mensaje");


    let numeroActual = null;


    /* =====================================================
       CREAR LOS 100 NÚMEROS
       ===================================================== */

    function crearNumeros() {

        contenedorNumeros.innerHTML = "";

        for (let i = 0; i <= 99; i++) {

            const numero =
                String(i).padStart(2, "0");

            const boton =
                document.createElement("div");

            boton.className = "numero";

            boton.id =
                `numero-${numero}`;

            boton.textContent =
                numero;

            boton.addEventListener(
                "click",
                () => seleccionarNumero(numero)
            );

            contenedorNumeros.appendChild(boton);
        }

        cargarNumerosOcupados();
    }


    /* =====================================================
       CARGAR NÚMEROS OCUPADOS
       ===================================================== */

    async function cargarNumerosOcupados() {

        for (let i = 0; i <= 99; i++) {

            const numero =
                String(i).padStart(2, "0");

            try {

                const referencia =
                    doc(
                        db,
                        CONFIG.coleccion,
                        numero
                    );

                const resultado =
                    await getDoc(referencia);

                if (resultado.exists()) {

                    const datos =
                        resultado.data();

                    if (
                        datos.estado &&
                        datos.estado !== "libre"
                    ) {

                        marcarOcupado(numero);
                    }
                }

            } catch (error) {

                console.error(
                    "Error leyendo número:",
                    numero,
                    error
                );
            }
        }
    }


    /* =====================================================
       MARCAR OCUPADO
       ===================================================== */

    function marcarOcupado(numero) {

        const elemento =
            document.getElementById(
                `numero-${numero}`
            );

        if (!elemento) return;

        elemento.classList.add(
            "ocupado-numero"
        );

        elemento.dataset.ocupado =
            "true";
    }


    /* =====================================================
       SELECCIONAR NÚMERO
       ===================================================== */

    async function seleccionarNumero(numero) {

        const elemento =
            document.getElementById(
                `numero-${numero}`
            );

        if (
            elemento &&
            elemento.dataset.ocupado === "true"
        ) {

            alert(
                "Este número ya está ocupado."
            );

            return;
        }


        /* Verificar nuevamente en Firebase */

        try {

            const referencia =
                doc(
                    db,
                    CONFIG.coleccion,
                    numero
                );

            const resultado =
                await getDoc(referencia);

            if (resultado.exists()) {

                const datos =
                    resultado.data();

                if (
                    datos.estado &&
                    datos.estado !== "libre"
                ) {

                    marcarOcupado(numero);

                    alert(
                        "Este número acaba de ser ocupado. Por favor selecciona otro."
                    );

                    return;
                }
            }

        } catch (error) {

            console.error(error);

            alert(
                "No se pudo verificar el número. Intenta nuevamente."
            );

            return;
        }


        numeroActual = numero;

        numeroSeleccionado.textContent =
            numero;

        nombre.value = "";

        tipoPago.value = "";

        mensaje.textContent = "";

        confirmar.disabled = false;

        modal.classList.add("activo");

        setTimeout(() => {
            nombre.focus();
        }, 200);
    }


    /* =====================================================
       CERRAR MODAL
       ===================================================== */

    function cerrarModal() {

        modal.classList.remove(
            "activo"
        );

        numeroActual = null;
    }


    cerrar.addEventListener(
        "click",
        cerrarModal
    );


    modal.addEventListener(
        "click",
        (event) => {

            if (
                event.target === modal
            ) {
                cerrarModal();
            }
        }
    );


    /* =====================================================
       CONFIRMAR RESERVA
       ===================================================== */

    confirmar.addEventListener(
        "click",
        async () => {

            if (!numeroActual) {
                return;
            }


            const nombreCliente =
                nombre.value.trim();

            const estadoPago =
                tipoPago.value;


            if (!nombreCliente) {

                alert(
                    "Por favor escribe tu nombre."
                );

                nombre.focus();

                return;
            }


            if (!estadoPago) {

                alert(
                    "Selecciona el estado del pago."
                );

                tipoPago.focus();

                return;
            }


            confirmar.disabled = true;

            mensaje.textContent =
                "Guardando reserva...";


            try {

                const referencia =
                    doc(
                        db,
                        CONFIG.coleccion,
                        numeroActual
                    );


                /*
                 * TRANSACTION:
                 * Evita que dos personas
                 * puedan tomar el mismo número
                 * al mismo tiempo.
                 */

                await runTransaction(
                    db,
                    async (transaction) => {

                        const documento =
                            await transaction.get(
                                referencia
                            );


                        if (
                            documento.exists()
                        ) {

                            const datos =
                                documento.data();


                            if (
                                datos.estado &&
                                datos.estado !== "libre"
                            ) {

                                throw new Error(
                                    "NUMERO_OCUPADO"
                                );
                            }
                        }


                        transaction.set(
                            referencia,
                            {

                                numero:
                                    numeroActual,

                                nombre:
                                    nombreCliente,

                                tipoPago:
                                    estadoPago,

                                estado:
                                    "ocupado",

                                fecha:
                                    new Date()
                                        .toISOString()
                            }
                        );

                    }
                );


                /* Marcar visualmente */

                marcarOcupado(
                    numeroActual
                );


                /* Mensaje WhatsApp */

                const textoWhatsApp =
                    `Hola, quiero reservar el número ${numeroActual} de la rifa.%0A%0A` +
                    `Nombre: ${nombreCliente}%0A` +
                    `Estado del pago: ${estadoPago}%0A%0A` +
                    `Quedo atento(a) a la confirmación.`;

                
                const urlWhatsApp =
                    `https://wa.me/${CONFIG.telefonoWhatsApp}?text=${textoWhatsApp}`;


                mensaje.textContent =
                    "Reserva registrada. Abriendo WhatsApp...";


                setTimeout(() => {

                    window.location.href =
                        urlWhatsApp;

                }, 700);


            } catch (error) {

                console.error(error);


                if (
                    error.message ===
                    "NUMERO_OCUPADO"
                ) {

                    marcarOcupado(
                        numeroActual
                    );

                    alert(
                        "Este número ya fue reservado por otra persona. Elige otro número."
                    );

                } else {

                    alert(
                        "No se pudo guardar la reserva. Revisa la conexión con Firebase."
                    );

                }


                confirmar.disabled =
                    false;

                mensaje.textContent = "";
            }

        }
    );


    /* =====================================================
       INICIAR
       ===================================================== */

    crearNumeros();

</script>

</body>
</html>

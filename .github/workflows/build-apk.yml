name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Agregar la carpeta android (si falta)
        run: flutter create --platforms=android .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Subir el APK generado (como artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rifa-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar el APK como Release (descarga directa, mejor para celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rifa App - build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

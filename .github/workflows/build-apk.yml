name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Agregar la carpeta android (si falta)
        run: flutter create --platforms=android .

      - name: Forzar el permiso de Internet en el AndroidManifest
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n\n    <application',
                  1
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Permiso de Internet agregado.")
          else:
              print("El permiso ya estaba presente.")
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Subir el APK generado (como artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rifa-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar el APK como Release (descarga directa, mejor para celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rifa App - build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
